{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-2">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="mb-0 fw-bold border-start border-4 border-primary ps-2">編輯任務</h3>
                    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary btn-sm">返回列表</a>
                </div>
                
                <form action="{{ url_for('main.update_task', id=task.id) }}" method="POST">
                    <div class="mb-3 bg-light p-3 rounded-2">
                        <label class="form-label fw-semibold text-secondary small text-uppercase">任務狀態</label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="status" id="statusPending" value="pending" {% if task.status == 'pending' %}checked{% endif %}>
                                <label class="form-check-label" for="statusPending">未完成 (Pending)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="status" id="statusCompleted" value="completed" {% if task.status == 'completed' %}checked{% endif %}>
                                <label class="form-check-label" for="statusCompleted">已完成 (Completed)</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">任務標題 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg" name="title" value="{{ task.title }}" required>
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">分類</label>
                            <select class="form-select" name="category_id">
                                <option value="" {% if not task.category_id %}selected{% endif %}>無分類</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if task.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">優先級</label>
                            <select class="form-select" name="priority">
                                <option value="high" {% if task.priority == 'high' %}selected{% endif %}>高優先</option>
                                <option value="medium" {% if task.priority == 'medium' %}selected{% endif %}>中優先</option>
                                <option value="low" {% if task.priority == 'low' %}selected{% endif %}>低優先</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">截止日期</label>
                        <input type="date" class="form-control" name="due_date" value="{{ task.due_date if task.due_date else '' }}">
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="{{ url_for('main.index') }}" class="btn btn-light px-4">取消</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">儲存變更</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
